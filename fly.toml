# Fly.io configuration for the Tar Labs marketing site.
# The site is static, served by nginx out of the image built from ./Dockerfile.

app = "tarlabs"
primary_region = "ewr"

[build]

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
