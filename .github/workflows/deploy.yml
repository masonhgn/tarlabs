name: Deploy to Fly

on:
  push:
    branches: [main]
    # The site lives in tarlabs.co/; nothing else in the monorepo affects the image.
    paths:
      - 'tarlabs.co/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        working-directory: tarlabs.co
        env:
          # flyctl reads FLY_API_TOKEN; the repository secret is named FLY_DEPLOY_TOKEN.
          FLY_API_TOKEN: ${{ secrets.FLY_DEPLOY_TOKEN }}
