server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The page, the stylesheet and the script carry no content hash in their
    # filenames, so a long cache would serve stale markup against fresh CSS.
    # Force a revalidation on each of them; they are small and gzip well.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.(?:css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Artwork is content-stable, so it can sit in the browser cache.
    location ~* \.(?:webp|png|jpe?g|gif|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Crawl files change with the site, so they revalidate rather than cache.
    location ~* \.(?:txt|xml)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
